services:
  postgres:
    image: postgres:15
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto-network

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - crypto-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - crypto-network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: crypto_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crypto-network
    depends_on:
      - app

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - .:/var/www
    networks:
      - crypto-network
    depends_on:
      - app
      - redis
      - postgres

volumes:
  postgres_data:

networks:
  crypto-network:
    driver: bridge